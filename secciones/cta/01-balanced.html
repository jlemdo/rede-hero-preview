<!-- Call to action / Balanced
     Clase raiz: .d2-cta-bal
     Extraido de home-d2.html. El CSS va en 01-balanced.css -->

<section class="d2-cta-bal d2-entra">
      <div class="d2-cta-bal__inner">

        <div class="d2-cta-bal__texto">
          <h2 class="d2-cta-bal__titulo">
            Find out what your buildings are actually costing you.
          </h2>
          <p class="d2-cta-bal__parrafo">
            Start with a clear, specific picture of the unnecessary energy costs in your
            building or portfolio. One set of inputs. A practical recommendation. No lock-in.
          </p>
        </div>

        <!-- ul y no ol: las dos vias son alternativas, no pasos. El orden
             no significa nada y un lector de pantalla no debe sugerirlo. -->
        <ul class="d2-cta-bal__acciones">
          <li class="d2-cta-bal__accion">
            <a href="#calculator" class="d2-btn d2-btn--solido d2-cta-bal__btn">
              Check your opportunity
              <svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true">
                <path d="M11.5 1L16.5 6L11.5 11M16 6H1" fill="none" stroke="currentColor"
                      stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </a>
          </li>
          <li class="d2-cta-bal__accion">
            <a href="contact.html" class="d2-btn d2-btn--linea d2-cta-bal__btn">
              Book a call
              <svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true">
                <path d="M11.5 1L16.5 6L11.5 11M16 6H1" fill="none" stroke="currentColor"
                      stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </a>
          </li>
        </ul>

      </div>
    </section>

<!-- Client logos / Three blocks
     Clase raiz: .d2-logos--dos
     Extraido de home-d2.html. El CSS va en 02-three-blocks.css -->

<!-- ====================================================================
         OPCION 2 — tres bloques

         Izquierda:  el titular.
         Centro:     la etiqueta y, debajo, los logos.
         Derecha:    la cifra.

         Los logos NO se reparten entre columnas: estan todos en el centro,
         en marquesina. Repartidos, la misma marca aparecia dos veces y se
         leia como si fueran clientes distintos.

         Se ven cinco a la vez para que salgan grandes; el resto va
         entrando por la derecha. La pista esta duplicada: es lo que hace
         que el bucle no tenga un salto visible al reiniciar.
         ==================================================================== -->
    <section class="d2-logos--dos">
      <div class="d2-logos--dos__inner">

        <div class="d2-logos--dos__izq">
          <p class="d2-logos--dos__titular">
            Proven across<br>complex multi-site<br>portfolios
          </p>
        </div>

        <div class="d2-logos--dos__centro">
          <p class="d2-logos--dos__etiqueta">PUBLIC-SECTOR PORTFOLIOS WE&rsquo;VE WORKED WITH</p>

          <div class="d2-logos--dos__marquesina">
            <div class="d2-logos--dos__pista">
              <img src="assets/img/logos-clientes/calgary-board.png" alt="Calgary Board of Education" width="200" height="200" decoding="async">
              <img src="assets/img/logos-clientes/greater-victoria.png" alt="Greater Victoria School District" width="200" height="200" decoding="async">
              <img src="assets/img/logos-clientes/northland.png" alt="Northland School Division" width="200" height="200" decoding="async">
              <img src="assets/img/logos-clientes/fort-vermilion.png" alt="Fort Vermilion School Division" width="200" height="200" decoding="async">
              <img src="assets/img/logos-clientes/cariboo-chilcotin.png" alt="Cariboo Chilcotin School District" width="200" height="200" decoding="async">
              <img src="assets/img/logos-clientes/grande-prairie.png" alt="Grande Prairie Public Schools" width="200" height="200" decoding="async">
              <img src="assets/img/logos-clientes/sunshine-coast.png" alt="Sunshine Coast School District" width="200" height="200" decoding="async">
              <img src="assets/img/logos-clientes/calgary-board.png" alt="" aria-hidden="true" width="200" height="200" decoding="async">
              <img src="assets/img/logos-clientes/greater-victoria.png" alt="" aria-hidden="true" width="200" height="200" decoding="async">
              <img src="assets/img/logos-clientes/northland.png" alt="" aria-hidden="true" width="200" height="200" decoding="async">
              <img src="assets/img/logos-clientes/fort-vermilion.png" alt="" aria-hidden="true" width="200" height="200" decoding="async">
              <img src="assets/img/logos-clientes/cariboo-chilcotin.png" alt="" aria-hidden="true" width="200" height="200" decoding="async">
              <img src="assets/img/logos-clientes/grande-prairie.png" alt="" aria-hidden="true" width="200" height="200" decoding="async">
              <img src="assets/img/logos-clientes/sunshine-coast.png" alt="" aria-hidden="true" width="200" height="200" decoding="async">
            </div>
          </div>
        </div>

        <div class="d2-logos--dos__der">
          <p class="d2-logos--dos__cifra">$4.4M</p>
          <p class="d2-logos--dos__cifra-pie">Cumulative savings</p>
          <p class="d2-logos--dos__cifra-nota">for one long-term client</p>
        </div>

      </div>
    </section>

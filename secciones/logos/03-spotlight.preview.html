<!-- ====================================================================
         OPCION 3 — FRANJA DE FOCO

         Las otras dos presentan los siete logos como iguales. Esta agrupa
         distinto: saca UNO y lo mete en la misma tarjeta que el $4.4M.

         El motivo es que la cifra se sostenga. Suelta en su columna --como
         en la opcion 2-- esta cerca de los logos pero no ligada a ninguno:
         afirma un ahorro sin dejar ver de quien. Dentro de un mismo marco
         que un logo, se lee como el resultado de ese cliente.

         Es el principio de region comun: un contorno visible agrupa mas
         fuerte que la simple cercania. Por eso la tarjeta lleva borde y no
         solo espacio en blanco.

         Los otros seis van al lado, apagados y quietos. No compiten; dan la
         escala ("son muchos distritos") mientras el protagonista sostiene
         el dato.

         Sin movimiento continuo a proposito: lo que se mueve no se lee, y
         estos logos solo aportan si se reconocen. La unica animacion es la
         entrada.
         ==================================================================== -->
    <section class="d2-foco" aria-labelledby="foco-titulo">
      <div class="d2-foco__inner">

        <div class="d2-foco__texto">
          <p class="d2-foco__titular" id="foco-titulo">
            Proven across<br>complex multi-site portfolios
          </p>
          <p class="d2-foco__etiqueta">PUBLIC-SECTOR PORTFOLIOS WE&rsquo;VE WORKED WITH</p>
        </div>

        <!-- La tarjeta: el logo y la cifra comparten marco. Eso es lo que
             ata el dato a un cliente concreto.

             PENDIENTE DE ERICK: falta confirmar cual de los siete distritos
             genero los $4.4M. Calgary Board esta de marcador de posicion.
             Cuando llegue la respuesta se cambia el src y el alt de esta
             imagen, y se saca ese distrito de la lista de al lado. -->
        <div class="d2-foco__prueba">
          <img class="d2-foco__prueba-logo"
               src="assets/img/logos-clientes/calgary-board.png"
               alt="Calgary Board of Education"
               width="400" height="200" loading="lazy" decoding="async">

          <div class="d2-foco__prueba-dato">
            <p class="d2-foco__cifra">$4.4M</p>
            <p class="d2-foco__cifra-pie">Cumulative savings</p>
            <p class="d2-foco__cifra-nota">for one long-term client</p>
          </div>
        </div>

        <!-- Los seis restantes: campo de apoyo, sin movimiento -->
        <ul class="d2-foco__resto" aria-label="Other public-sector portfolios">
          <li><img src="assets/img/logos-clientes/greater-victoria.png" alt="Greater Victoria School District" width="693" height="200" loading="lazy" decoding="async"></li>
          <li><img src="assets/img/logos-clientes/northland.png" alt="Northland School Division" width="244" height="200" loading="lazy" decoding="async"></li>
          <li><img src="assets/img/logos-clientes/fort-vermilion.png" alt="Fort Vermilion School Division" width="200" height="200" loading="lazy" decoding="async"></li>
          <li><img src="assets/img/logos-clientes/cariboo-chilcotin.png" alt="Cariboo Chilcotin School District" width="400" height="200" loading="lazy" decoding="async"></li>
          <li><img src="assets/img/logos-clientes/grande-prairie.png" alt="Grande Prairie Public Schools" width="197" height="200" loading="lazy" decoding="async"></li>
          <li><img src="assets/img/logos-clientes/sunshine-coast.png" alt="Sunshine Coast School District" width="400" height="200" loading="lazy" decoding="async"></li>
        </ul>

      </div>
    </section>

<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<title>Rede Energy Solutions</title>
<!-- Esta pagina no forma parte de la vista previa que se comparte.

     Solo se publica la home. GitHub Pages sirve cualquier .html del
     repositorio y no hay forma de protegerlo con contrasena, asi que el
     contenido real vive en _paginas/ --el guion bajo hace que Pages no
     la publique-- y aqui queda un redirector.

     El meta refresh actua aunque el JavaScript este desactivado; el
     script cubre el caso contrario y ademas reemplaza la entrada en el
     historial, para que el boton de atras no devuelva aqui. -->
<meta http-equiv="refresh" content="0; url=./index.html">
<link rel="canonical" href="./index.html">
<meta name="robots" content="noindex">
<script>location.replace('./index.html');</script>
</head>
<body>
<p>Redirecting to <a href="./index.html">Rede Energy Solutions</a>.</p>
</body>
</html>
